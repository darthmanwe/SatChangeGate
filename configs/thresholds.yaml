# Mask thresholds (OSCD L1C heuristics — no SCL band)
masks:
  cloud_brightness: 0.35
  cloud_ndvi_max: 0.2
  snow_ndsi_min: 0.4
  snow_nir_min: 0.25
  water_ndwi_min: 0.3
  shadow_nir_max: 0.15
  shadow_brightness_max: 0.12

# Quality gate
quality:
  cloud_fraction_max: 0.25
  min_valid_pixel_fraction: 0.5
  min_quality_score: 0.3

# Classical change gate — tuned on OPTIMUS labeled tiles (148 + 425)
gate:
  cloud_fraction_max: 0.25
  registration_error_px_max: 1.5
  min_changed_area_percent: 25.0
  ndvi_delta_mean_min: 0.10
  ndbi_delta_mean_min: 0.08
  ndwi_delta_mean_min: 0.15
  ndvi_strong_min: 0.12
  ndbi_strong_min: 0.10
  ndbi_built_min: 0.09
  spectral_quiet_max: 0.07
  ssim_no_change_min: 0.65
  phash_no_change_max: 16
  index_delta_small: 0.10
  cva_magnitude_threshold: 0.24
  cva_magnitude_mean_min: 0.28
  illumination_no_change_max: 0.12
  phenology_spectral_max: 0.08
  phenology_ssim_max: 0.22
  phenology_area_max_percent: 90.0
  unreliable_ssim_max: 0.08
  unreliable_spectral_max: 0.10
  high_area_structural_min: 70.0
  high_area_spectral_min: 0.078
  ndvi_moderate_min: 0.065
  ndbi_moderate_min: 0.065
  moderate_area_min_percent: 45.0

# Radiometric
radiometric:
  percentile_low: 2
  percentile_high: 98

# Bands used (Sentinel-2)
bands:
  - B02
  - B03
  - B04
  - B08
  - B11
  - B12

rgb_bands:
  - B04
  - B03
  - B02
