name: CI

on:
  push:
    # Any branch: a push that CI never sees is a push with no signal, and
    # the previous [main, "revamp/**"] list silently skipped feature branches.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Guarantees no test can reach the paid API even if one slipped past markers.
  ANTHROPIC_API_KEY: ""

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  test:
    name: tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the project is developed there and
        # has had platform-specific path handling.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run offline test suite
        run: pytest --cov=satchangegate --cov-report=xml --cov-report=term-missing
      - name: Verify packaged config resolves from a wheel install
        shell: bash
        run: |
          pip install --force-reinstall --no-deps .
          cd "$(mktemp -d)"
          python -c "from satchangegate.config import get_settings; s=get_settings(); assert s.gate.background_sigma > 0 and len(s.bands) == 6; print('packaged config OK')"
          satchangegate --version

      - name: Upload coverage report
        # The XML was already being generated and discarded. Keeping it as an
        # artifact costs nothing and makes a coverage regression visible.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t satchangegate:ci .
      - name: Container starts and reports its version
        run: docker run --rm satchangegate:ci --version
