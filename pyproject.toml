[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satchangegate"
version = "0.1.0"
description = "Preprocessing-first satellite temporal change detection PoC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]
optimus = [
    "huggingface_hub>=0.20",
]
goes = [
    "goes2go>=2025.1",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "h5py>=3.8",
]
data = [
    "huggingface_hub>=0.20",
    "goes2go>=2025.1",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "h5py>=3.8",
]

[project.scripts]
satchangegate = "satchangegate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oscd: requires OSCD dataset on disk",
    "optimus: requires OPTIMUS metadata/sample tar",
    "goes: requires goes2go and network for GOES download",
    "e2e: end-to-end integration (may call external APIs)",
    "vlm: requires ANTHROPIC_API_KEY for live VLM",
]

[tool.ruff]
line-length = 100
target-version = "py310"
